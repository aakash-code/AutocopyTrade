<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Trading Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
        }
        .container {
            width: 80%;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        form {
            margin-bottom: 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Copy Trading Dashboard</h1>

        <h2>Manage Credentials</h2>
        <form id="credentials-form">
            <h3>Dhan</h3>
            <label for="dhan-client-id">Client ID</label>
            <input type="text" id="dhan-client-id" name="dhan-client-id">
            <label for="dhan-access-token">Access Token</label>
            <input type="password" id="dhan-access-token" name="dhan-access-token">

            <h3>Angel One</h3>
            <label for="angelone-api-key">API Key</label>
            <input type="text" id="angelone-api-key" name="angelone-api-key">
            <label for="angelone-client-code">Client Code</label>
            <input type="text" id="angelone-client-code" name="angelone-client-code">
            <label for="angelone-password">Password</label>
            <input type="password" id="angelone-password" name="angelone-password">
            <label for="angelone-totp-secret">TOTP Secret</label>
            <input type="password" id="angelone-totp-secret" name="angelone-totp-secret">

            <button type="submit">Save Credentials</button>
        </form>

        <h2>Live Trades</h2>
        <table id="trades-table">
            <thead>
                <tr>
                    <th>Broker</th>
                    <th>Symbol</th>
                    <th>Transaction Type</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Trades will be dynamically added here -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
