<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Account - {{ account_name }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #1a1a1a; color: #f0f2f5; margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; }
        a { color: #3498db; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card { background: #2c2c2c; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #555; background-color: #333; color: #fff; box-sizing: border-box; }
        button { padding: 10px 20px; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 1rem; background-color: #3498db; }
    </style>
</head>
<body>
    <div class="container">
        <p><a href="{{ url_for('accounts') }}">&larr; Back to Accounts</a></p>
        <h1>Edit Account: {{ account_name }}</h1>

        <div class="card">
            <form action="{{ url_for('update_account', account_name=account_name) }}" method="POST">
                <p>Note: For security, password and TOTP secret are not displayed. Enter a new value only if you wish to change it.</p>

                <div class="form-group">
                    <label for="broker">Broker</label>
                    <input type="text" id="broker" name="broker" value="{{ account.broker }}" readonly>
                </div>

                {% if account.broker == 'zerodha' %}
                <div class="form-group">
                    <label for="userid">User ID</label>
                    <input type="text" id="userid" name="userid" value="{{ account.userid }}" required>
                </div>
                <div class="form-group">
                    <label for="password">New Password (optional)</label>
                    <input type="password" id="password" name="password" placeholder="Leave blank to keep unchanged">
                </div>
                <div class="form-group">
                    <label for="totp_secret">New TOTP Secret (optional)</label>
                    <input type="password" id="totp_secret" name="totp_secret" placeholder="Leave blank to keep unchanged">
                </div>
                <div class="form-group">
                    <label for="api_key">API Key</label>
                    <input type="text" id="api_key" name="api_key" value="{{ account.APIKey }}">
                </div>
                <div class="form-group">
                    <label for="api_secret">API Secret</label>
                    <input type="text" id="api_secret" name="api_secret" value="{{ account.APISecret }}">
                </div>
                {% elif account.broker == 'dhan' %}
                <div class="form-group">
                    <label for="userid">Client ID</label>
                    <input type="text" id="userid" name="userid" value="{{ account.clientID }}" required>
                </div>
                <div class="form-group">
                    <label for="access_token">Access Token</label>
                    <input type="text" id="access_token" name="access_token" value="{{ account.accessToken }}">
                </div>
                {% endif %}

                <div class="form-group">
                    <label for="multiplier">Multiplier</label>
                    <input type="number" step="0.01" id="multiplier" name="multiplier" value="{{ account.multiplier }}" required>
                </div>
                <div class="form-group">
                    <label for="enabled">Enabled</label>
                    <select id="enabled" name="enabled">
                        <option value="Y" {% if account.enabled == 'Y' %}selected{% endif %}>Yes</option>
                        <option value="N" {% if account.enabled == 'N' %}selected{% endif %}>No</option>
                    </select>
                </div>
                <button type="submit">Update Account</button>
            </form>
        </div>
    </div>
</body>
</html>
