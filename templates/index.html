<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Replicator Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #1a1a1a; color: #f0f2f5; margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .card { background: #2c2c2c; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .nav { margin-bottom: 20px; }
        .nav a { color: #3498db; text-decoration: none; font-size: 1.2rem; }
        .nav a:hover { text-decoration: underline; }
        .status-box { padding: 1rem; border-radius: 4px; margin-top: 1rem; }
        .status-Running { background-color: #27ae60; color: #fff; }
        .status-Stopped { background-color: #c0392b; color: #fff; }
        .status-Error { background-color: #e67e22; color: #fff; }
        .status-Unknown { background-color: #7f8c8d; color: #fff; }
        .controls button { padding: 0.8rem 1.5rem; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 1rem; }
        #startButton { background-color: #28a745; }
        #stopButton { background-color: #dc3545; }
        #startButton:disabled, #stopButton:disabled { background-color: #777; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/accounts">Manage Accounts</a> |
            <a href="/mapping">Instrument Mapping</a>
        </div>
        <h1>Trade Replicator Dashboard</h1>

        <div class="card">
            <h2>Replicator Control</h2>
            <div class="controls">
                <button id="startButton">Start Replicator</button>
                <button id="stopButton">Stop Replicator</button>
            </div>
            <div id="status" class="status-box">
                <p><strong>Status:</strong> <span id="status-text">Loading...</span></p>
            <p><span id="status-message"></span></p>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        const statusMessage = document.getElementById('status-message');
        const statusBox = document.getElementById('status');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                statusText.textContent = data.status;
                statusMessage.textContent = data.message;
                statusBox.className = `status-box status-${data.status}`;

                if (data.status === 'Running') {
                    startButton.disabled = true;
                    stopButton.disabled = false;
                } else {
                    startButton.disabled = false;
                    stopButton.disabled = true;
                }
            } catch (error) {
                statusText.textContent = 'Error';
                statusMessage.textContent = 'Could not connect to the server.';
                statusBox.className = 'status-box status-Error';
            }
        }

        startButton.addEventListener('click', async () => {
            await fetch('/api/start', { method: 'POST' });
            updateStatus();
        });

        stopButton.addEventListener('click', async () => {
            await fetch('/api/stop', { method: 'POST' });
            updateStatus();
        });

        // Initial status update and then poll every 5 seconds
        updateStatus();
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
