<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade History</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #1a1a1a; color: #f0f2f5; margin: 0; padding: 2rem; }
        .container { max-width: 1400px; margin: auto; }
        h1 { color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; }
        a { color: #3498db; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card { background: #2c2c2c; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .search-box { margin-bottom: 10px; width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #555; background-color: #333; color: #fff; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #444; text-align: left; word-break: break-all; }
        th { background-color: #2c3e50; }
    </style>
</head>
<body>
    <div class="container">
        <p><a href="/">&larr; Back to Dashboard</a></p>
        <h1>Trade History Log</h1>

        <div class="card">
            <input type="text" class="search-box" id="history_search" onkeyup="filterTable('history_table', 'history_search')" placeholder="Search for accounts, actions, etc...">
            <table id="history_table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Child Account</th>
                        <th>Action</th>
                        <th>Order Data</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in trade_log %}
                    <tr>
                        <td>{{ row.timestamp }}</td>
                        <td>{{ row.child_account }}</td>
                        <td>{{ row.action }}</td>
                        <td><pre>{{ row.order_data }}</pre></td>
                        <td><pre>{{ row.result }}</pre></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function filterTable(tableId, inputId) {
            const input = document.getElementById(inputId);
            const filter = input.value.toUpperCase();
            const table = document.getElementById(tableId);
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) { // Start from 1 to skip header
                tr[i].style.display = "none"; // Hide row by default
                const tds = tr[i].getElementsByTagName("td");
                for (let j = 0; j < tds.length; j++) {
                    if (tds[j]) {
                        if (tds[j].innerText.toUpperCase().indexOf(filter) > -1) {
                            tr[i].style.display = ""; // Show row if match found
                            break;
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
