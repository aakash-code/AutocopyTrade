<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Settings</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #1a1a1a; color: #f0f2f5; margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; }
        a { color: #3498db; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card { background: #2c2c2c; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #555; background-color: #333; color: #fff; box-sizing: border-box; }
        .form-group small { color: #888; }
        button { padding: 10px 20px; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 1rem; background-color: #3498db; }
    </style>
</head>
<body>
    <div class="container">
        <p><a href="/">&larr; Back to Dashboard</a></p>
        <h1>Global Settings</h1>

        <div class="card">
            <form action="/update_settings" method="POST">
                <h2>Product Filter</h2>
                <div class="form-group">
                    <label for="donotprocessprod">Products to Ignore</label>
                    <input type="text" id="donotprocessprod" name="donotprocessprod" value="{{ product_filter_str }}">
                    <small>Enter a comma-separated list of product types to ignore (e.g., CNC, NRML).</small>
                </div>
                <button type="submit">Save Settings</button>
            </form>
        </div>
    </div>
</body>
</html>
